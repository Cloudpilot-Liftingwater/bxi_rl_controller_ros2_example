schema: 1
id: com.bxi.dance_test
name: 舞蹈执行精度测试
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: public
requires: [com.bxi.basic_actions, com.bxi.suspended_tests]
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros: []
  system: []

events:
  dance: {slot: btn_6, value: 2}

states:
  dance:
    manifest:
      label: 舞蹈精度测试
      priority: 850
      group: Tests
      confirm: true
      confirm_message: 执行舞蹈模型；请先完成对应模型和动作的仿真与现场检查

routes:
  - from: com.bxi.basic_actions/normal
    event: dance
    to: dance
    transition:
      type: running_blend
      duration: 2.0
      curve: smootherstep
      sample_from: true
      sample_to: true
      advance_from: true
      advance_to: false
  - {from: dance, event: com.bxi.basic_actions/zero_torque, to: com.bxi.basic_actions/zero_torque}
  - {from: dance, event: com.bxi.basic_actions/pd_brake, to: com.bxi.basic_actions/pd_brake, transition: first_frame_switch}

actions:
  - {from: dance, event: dance, action: cancel, manifest: {label: 结束舞蹈测试}}
  - {from: dance, event: com.bxi.basic_actions/normal, action: cancel, manifest: {label: 返回normal}}
